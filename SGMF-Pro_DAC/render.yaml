# Infraestrutura do SGMF Pro no Render.
# Ao conectar o repositório do GitHub, o Render lê este arquivo e cria tudo.
services:
  - type: web
    name: sgmf-pro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask db upgrade && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    # Aplica as mudanças de estrutura do banco antes de publicar a nova versão.
    # (Se o seu plano não tiver pre-deploy, rode "flask db upgrade" no Shell do Render.)
    preDeployCommand: flask db upgrade
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: app.py
      - key: TZ
        value: America/Sao_Paulo
      - key: SECRET_KEY
        generateValue: true          # o Render gera uma chave forte sozinho
      - key: ADMIN_EMAIL
        sync: false                  # informe no painel do Render
      - key: SMTP_SENHA
        sync: false                  # senha de aplicativo do Gmail; vazio = e-mail desligado
      - key: EMAIL_DESTINATARIOS
        value: estudosti20@gmail.com
      - key: ALERTAS_HORA
        value: "7"
      - key: ADMIN_SENHA
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sgmf-banco
          property: connectionString

databases:
  - name: sgmf-banco
    databaseName: sgmf
    plan: free
