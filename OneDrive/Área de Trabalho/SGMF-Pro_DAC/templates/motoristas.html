{% extends "lista.html" %}
{% block titulo %}Motoristas{% endblock %}
{% block cabecalho %}Motoristas{% endblock %}
{% block descricao %}Condutores da frota, habilitação e vencimento de CNH.{% endblock %}
{% block rotulo_novo %}Novo motorista{% endblock %}

{% block scripts %}
<script>
SGMF.tela({
  recurso: 'motoristas',
  titulo: 'motorista',
  campos: [
    { nome: 'nome', rotulo: 'Nome completo', col: 6, obrigatorio: true },
    { nome: 'matricula', rotulo: 'Matrícula', col: 3 },
    { nome: 'telefone', rotulo: 'Telefone', col: 3 },
    { nome: 'cnh', rotulo: 'Número da CNH', col: 4 },
    { nome: 'categoria_cnh', rotulo: 'Categoria', tipo: 'select', col: 2,
      opcoes: ['A', 'B', 'AB', 'C', 'D', 'E'] },
    { nome: 'validade_cnh', rotulo: 'Validade da CNH', tipo: 'date', col: 3 },
    { nome: 'setor', rotulo: 'Setor', col: 3 },
    { nome: 'ativo', rotulo: 'Motorista ativo', tipo: 'checkbox', col: 4 }
  ],
  colunas: [
    { campo: 'nome', rotulo: 'Nome' },
    { campo: 'matricula', rotulo: 'Matrícula', classe: 'num' },
    { campo: 'cnh', rotulo: 'CNH', classe: 'num' },
    { campo: 'categoria_cnh', rotulo: 'Cat.' },
    { campo: 'validade_cnh', rotulo: 'Validade', render: v => {
        if (!v) return '—';
        const dias = Math.round((new Date(v) - new Date()) / 86400000);
        const cor = dias < 0 ? 'vermelha' : (dias < 30 ? 'ambar' : 'cinza');
        return SGMF.etiqueta(SGMF.data(v), cor);
      } },
    { campo: 'setor', rotulo: 'Setor' },
    { campo: 'ativo', rotulo: 'Situação', render: v => SGMF.etiqueta(v ? 'Ativo' : 'Inativo', v ? 'verde' : 'cinza') }
  ]
});
</script>
{% endblock %}
